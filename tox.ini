[tox]
envlist = py312-test
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner

[testenv:py312-test]
dependency_groups = test
commands =
    python -c "import openedx_atlas; print('Package import OK')"

[testenv:quality]
dependency_groups = quality
allowlist_externals = echo
commands =
    echo "No Python quality checks configured for this shell-script-based package."
